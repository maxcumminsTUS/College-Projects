<!DOCTYPE HTML>
<html lang="en">
<head> 
<meta charset="utf-8">
    
<title>Contact Page</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">

    <style> 
body {
    font-family: 'Roboto', sans-serif;  /* Set the font for the body text */
    margin: 0;  
    padding: 0;  
    background: linear-gradient(135deg, #4CAF50, #2C6E49);  
    color: #fff;  /* Set the text color to white */
    text-align: center;  /* Center align all text inside the body */
}


.container {
    max-width: 1200px;  
    margin: 0 auto;  
    padding: 20px;  /* Add padding inside the container */
}

h1 {
    font-family: 'Open Sans', sans-serif;  /* Use Open Sans font for the header */
    font-size: 48px;  /* Set font size to 48px */
    margin-top: 30px;  /* Add space above the header */
    color: #fff;  /* Set the text color of the header to white */
}


img {
    display: block;  
    margin: 20px auto;  /* Add space around the image and center it */
    width: 140px;  /* Set the width of the image */
    vertical-align: middle;  /* Align image vertically */
}


nav {
    margin-top: 20px;  /* Add space above the navigation */
    text-align: center;  /* Center align navigation links */
}


nav a {
    margin: 0 15px;  /* Add space between links */
    font-size: 18px;  /* Set the font size of the links */
    color: #fff;  /* Set the text color to white */
    text-decoration: none;  /* Remove underline from the links */
    padding: 10px 20px;  /* Add padding inside the links */
    border-radius: 5px;  /* Round the corners of the links */
    background-color: rgba(0, 0, 0, 0.3);  
    transition: background-color 0.3s ease;  
}


nav a:hover {
    background-color: rgba(0, 0, 0, 0.5);  
}


form {
    margin-top: 30px;  
    padding: 30px;  
    background-color: rgba(255, 255, 255, 0.1);  
    border-radius: 10px;  
    max-width: 800px; 
    margin-left: auto;  
    margin-right: auto;  
}


fieldset {
    border: 2px solid #fff;  
    padding: 20px;  
    margin-bottom: 20px;  
    border-radius: 8px;  
}


legend {
    font-size: 24px;  /* Set the font size of the legend */
    font-weight: bold;  /* Make the legend text bold */
    color: #FFB81C;  /* Set the color of the legend to a goldish yellow */
}


label {
    display: block;  
    margin: 10px 0 5px;  
    font-size: 16px;  
}


input[type="text"],
input[type="email"],
select,
input[type="radio"],
input[type="checkbox"] {
    width: 100%;
    padding: 12px;  /* Add padding inside the input fields */
    margin: 8px 0;  
    border-radius: 5px;  /* Round the corners of input fields */
    border: 1px solid #ccc;  /* Set a light gray border around input fields */
    background-color: #fff;  /* Set the background color of inputs to white */
    color: #333;  /* Set the text color inside input fields to dark gray */
    font-size: 16px;  /* Set the font size of text inside input fields */
}


input[type="radio"],
input[type="checkbox"] {
    width: auto;  
    margin-right: 5px;  
}


input[type="submit"],
input[type="reset"] {
    background-color: #FFB81C; 
    color: #fff; 
    padding: 12px 30px;  
    border: none; 
    border-radius: 5px; 
    font-size: 18px;  
    cursor: pointer;  
    transition: background-color 0.3s ease;  
}


input[type="submit"]:hover,
input[type="reset"]:hover {
    background-color: #FFD700;  
}


footer {
    margin-top: 50px; 
    padding: 10px;  
    background-color: rgba(0, 0, 0, 0.6); 
    color: #fff;  
}


footer p {
    font-size: 16px;  
    margin: 0;  
}


    </style>   
</head>
<body>

<div class="container">
<h1>Contact Us - Djibouti</h1>
<a href="Index.html">
    <img src="Pictures/Dji.flag.png" alt="Djibouti Flag">
</a>
    
<br>
<hr>
<nav>
    <a href="Index.html">Home</a>
    <a href="#AddressInformation">Address Information</a>
    <a href="#DjiboutiCitizen">Djibouti Citizen</a>
    <a href="Contact.html">Contact</a>
</nav>

<br>
<hr>

<h1 id="ContactForm">Contact Us</h1>

<form action="https://tusprojects.net/wdf-a1-countries.php" method="POST">
            
<p>
<label for="firstName">First Name:</label>
<input type="text" id="firstName" name="firstName" size="23" required>
</p>
            
<p>
<label for="surname">Surname:</label>
<input type="text" id="surname" name="surname" size="23" required>
</p>
            
<p>
<label for="email">Email:</label>
<input type="email" id="email" name="email" size="23" required>
</p>

<br>

<fieldset id="AddressInformation">
<legend>Address Information</legend>
                
<p>
    <label for="address">Street Address:</label>
    <input type="text" id="address" name="address" size="50" required>
</p>

<p>
    <label for="city">City:</label>
    <input type="text" id="city" name="city" size="23" required>
</p>

<p>
    <label for="province">Province:</label>
    <select id="province" name="province" required>
        <option value="" disabled selected>Select Province</option> 
        <option value="ulster">Ulster</option>
        <option value="leinster">Leinster</option>
        <option value="munster">Munster</option>
        <option value="connacht">Connacht</option>
    </select>
</p>

<p>
<label for="country">Country:</label>
<input type="text" id="country" name="country" size="23" required>
</p>
            
</fieldset>

<br>

<fieldset id="DjiboutiCitizen">
<legend>Are you a Djibouti Citizen?</legend>
                
<p>
<label><input type="radio" name="citizen" value="Yes" required> Yes</label>
<label><input type="radio" name="citizen" value="No" required> No</label>
</p>
            
</fieldset>

<br>

<fieldset>
<legend>What type of information are you interested in?</legend>
                
<p>
<label><input type="checkbox" name="typeInfo[]" value="econ"> Economy</label>
<label><input type="checkbox" name="typeInfo[]" value="en"> Energy</label>
<label><input type="checkbox" name="typeInfo[]" value="env"> Environment</label>
<label><input type="checkbox" name="typeInfo[]" value="military"> Military</label>
<label><input type="checkbox" name="typeInfo[]" value="transp"> Transportation</label>
</p>
                
</fieldset>
<input type="hidden" name="code" value="ref123">

<p>
<input type="submit" value="Submit">
<input type="reset" value="Reset">
</p>
            
</form>

<hr>
<footer>
    <p>2024-Djibouti-Max Cummins <a href="mailto:K00319172@student.tus.ie">K00319172@student.tus.ie</a></p>
</footer>
</div>
</body>
</html>
